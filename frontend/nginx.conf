worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # The web port is loopback-only. A TLS edge must overwrite this header.
    map $http_x_forwarded_proto $session_flag {
        default httponly;
        https secure;
    }
    server {
        listen 8080;
        root /srv/web;
        location /api/ {
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $backend http://api:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cookie_flags ~ $session_flag;
            # Stream the multipart body; the API owns the configured upload limit.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
