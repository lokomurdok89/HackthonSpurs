services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: backend/HackthonSpurs.Api/Dockerfile
    environment:
      ConnectionStrings__Documents: "Host=postgres;Database=documents;Username=documents;Timeout=5;Command Timeout=10"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      Storage__Root: /data/originals
      Storage__MaxFileBytes: ${UPLOAD_MAX_BYTES:-20971520}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - originals:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: [synthetic]
    build:
      context: .
      dockerfile: backend/HackthonSpurs.Worker/Dockerfile
    environment:
      ConnectionStrings__Documents: "Host=postgres;Database=documents;Username=documents;Timeout=5;Command Timeout=10"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      Storage__Root: /data/originals
      Reader__Endpoint: http://fixture-reader:8080/internal/read
    volumes:
      - originals:/data/originals:ro
    depends_on:
      api:
        condition: service_started
      fixture-reader:
        condition: service_started
  fixture-reader:
    profiles: [synthetic]
    build:
      context: .
      dockerfile: backend/reader-fixture/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
volumes:
  database:
  originals:
