services:
  postgres:
    build: ./backend/Infrastructure/PostgresVector
    image: hackthonspurs/postgres-vector:18.4-alpine3.23-v0.8.2
    pull_policy: build
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: backend/HackthonSpurs.Api/Dockerfile
    environment:
      ConnectionStrings__Documents: "Host=postgres;Database=documents;Username=documents;Timeout=5;Command Timeout=10"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      Storage__Root: /data/originals
      Storage__MaxFileBytes: "${UPLOAD_MAX_BYTES:-}"
      Auth__DemoSeedEnabled: "${Auth__DemoSeedEnabled:-false}"
      Auth__DemoAdminPassword: "${Auth__DemoAdminPassword:-}"
      Auth__DemoReaderPassword: "${Auth__DemoReaderPassword:-}"
      Auth__BootstrapUsername: "${Auth__BootstrapUsername:-}"
      Auth__BootstrapPassword: "${Auth__BootstrapPassword:-}"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - originals:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: [synthetic]
    build:
      context: .
      dockerfile: backend/HackthonSpurs.Worker/Dockerfile
    environment:
      ConnectionStrings__Documents: "Host=postgres;Database=documents;Username=documents;Timeout=5;Command Timeout=10"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      Storage__Root: /data/originals
      Reader__Endpoint: http://fixture-reader:8080/internal/read
    volumes:
      - originals:/data/originals:ro
    depends_on:
      api:
        condition: service_started
      fixture-reader:
        condition: service_started
  fixture-reader:
    profiles: [synthetic]
    build:
      context: .
      dockerfile: backend/HackthonSpurs.Reader.Fixture/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
volumes:
  database:
  originals:
